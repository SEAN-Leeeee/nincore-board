name: Deploy to EC2
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend
        working-directory: nincore-board/backend/nincoreboard-api
        run: ./gradlew build -x test

      - name: Build frontend
        working-directory: nincore-board/frontend/scoreboard-remote
        run: |
          npm install
          npm run build

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "nincore-board/backend/nincoreboard-api/build/libs/nincoreboard-api-0.0.1-SNAPSHOT.jar,nincore-board/frontend/scoreboard-remote/dist"
          target: "~/"

      - name: Restart server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp -r ~/nincore-board/frontend/scoreboard-remote/dist/* /var/www/nincore-board/
            PID=$(pgrep -f 'nincoreboard-api.*\.jar' || true)
            if [ -n "$PID" ]; then
              kill -9 $PID
            fi
            nohup java -jar ~/nincore-board/backend/nincoreboard-api/build/libs/nincoreboard-api-0.0.1-SNAPSHOT.jar > ~/nincore.log 2>&1 &
